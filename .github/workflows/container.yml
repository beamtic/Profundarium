name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Application tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release version and sample image tags
        run: python3 docker/check-version.py
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          load: true
          tags: profundarium:tests
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests
      - name: Install test dependencies and run tests
        run: |
          docker run --rm profundarium:tests /bin/sh -ec '
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            composer install --prefer-dist --no-interaction --no-progress
            touch .env
            composer test
          '

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: profundarium:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: Check read-only runtime, rendering, cache, and stderr logging
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges:true --read-only --tmpfs /tmp:size=64m,mode=1777 \
            profundarium:ci /bin/sh docker/php85/smoke-test.sh
      - name: Check sample Nginx Compose setup and mounted files
        run: python3 docker/check-compose.py profundarium:ci
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked image
        if: github.event_name == 'push'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag profundarium:ci "$image:sha-$COMMIT"
          docker push "$image:sha-$COMMIT"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must have the form v1.2.3' >&2
              exit 1
            fi
            tag="$version"
          else
            tag=main
          fi
          docker tag profundarium:ci "$image:$tag"
          docker push "$image:$tag"
