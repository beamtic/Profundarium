# Master and workers run as the container's non-root nginx account.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 8080;
        server_name _;
        root /srv/profundarium/public;
        index index.php;
        # Optional HedgeDoc uploads mount; never expose the whole public volume.
        location /uploads/ {
            alias /hedgedoc/public/uploads/;
            autoindex off;
            disable_symlinks on;
            add_header X-Content-Type-Options nosniff always;
        }
        # Optional administrator-managed public files.
        location /static/ {
            alias /srv/static/;
            autoindex off;
            disable_symlinks on;
            add_header X-Content-Type-Options nosniff always;
        }
        location / { try_files $uri /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/profundarium/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass profundarium:9000;
        }
        location ~ \.php(?:/|$) { return 404; }
        location ~ /\. { deny all; }
    }
}
